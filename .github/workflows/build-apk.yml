name: Build Android APK

on:
  push:
    branches: [main, feature/testable-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create . --platforms=android --org com.dnbplantai

      - name: Configure Android scheduled notifications
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permissions = '''
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
          '''
          if "android.permission.RECEIVE_BOOT_COMPLETED" not in content:
              start = content.find("<manifest")
              end = content.find(">", start)
              content = content[:end + 1] + permissions + content[end + 1:]
          receivers = '''
              <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver"/>
              <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                  <intent-filter>
                      <action android:name="android.intent.action.BOOT_COMPLETED"/>
                      <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                      <action android:name="android.intent.action.QUICKBOOT_POWERON"/>
                      <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>
                  </intent-filter>
              </receiver>
          '''
          if "ScheduledNotificationReceiver" not in content:
              content = content.replace("</application>", receivers + "\n</application>")
          manifest.write_text(content)

          gradle_kts = Path("android/app/build.gradle.kts")
          gradle = Path("android/app/build.gradle")
          if gradle_kts.exists():
              g = gradle_kts.read_text()
              if "multiDexEnabled" not in g:
                  g = g.replace("defaultConfig {", "defaultConfig {\n        multiDexEnabled = true", 1)
              if "isCoreLibraryDesugaringEnabled" not in g:
                  g = g.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true", 1)
              if "coreLibraryDesugaring(" not in g:
                  if "dependencies {" in g:
                      g = g.replace("dependencies {", 'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")', 1)
                  else:
                      g += '\ndependencies { coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4") }\n'
              gradle_kts.write_text(g)
          elif gradle.exists():
              g = gradle.read_text()
              if "multiDexEnabled" not in g:
                  g = g.replace("defaultConfig {", "defaultConfig {\n        multiDexEnabled true", 1)
              if "coreLibraryDesugaringEnabled" not in g:
                  g = g.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true", 1)
              if "coreLibraryDesugaring " not in g:
                  g += "\ndependencies { coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4' }\n"
              gradle.write_text(g)
      - name: Configure native Android ambient light sensor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/kotlin/com/dnbplantai/dnb_plant_ai/MainActivity.kt")
          p.parent.mkdir(parents=True, exist_ok=True)
          source = r'''package com.dnbplantai.dnb_plant_ai

          import android.content.Context
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.EventChannel
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private val methodName = "dnbplantai/light_sensor"
              private val eventName = "dnbplantai/light_stream"
              private var sensorManager: SensorManager? = null
              private var lightSensor: Sensor? = null
              private var eventSink: EventChannel.EventSink? = null
              private val listener = object : SensorEventListener {
                  override fun onSensorChanged(event: SensorEvent) {
                      eventSink?.success(event.values.firstOrNull()?.toDouble())
                  }
                  override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  sensorManager = getSystemService(Context.SENSOR_SERVICE) as SensorManager
                  lightSensor = sensorManager?.getDefaultSensor(Sensor.TYPE_LIGHT)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, methodName)
                      .setMethodCallHandler { call, result ->
                          if (call.method == "hasSensor") result.success(lightSensor != null)
                          else result.notImplemented()
                      }
                  EventChannel(flutterEngine.dartExecutor.binaryMessenger, eventName)
                      .setStreamHandler(object : EventChannel.StreamHandler {
                          override fun onListen(arguments: Any?, events: EventChannel.EventSink?) {
                              eventSink = events
                              val sensor = lightSensor
                              if (sensor == null) events?.error("NO_SENSOR", "Ambient light sensor unavailable", null)
                              else sensorManager?.registerListener(listener, sensor, SensorManager.SENSOR_DELAY_NORMAL)
                          }
                          override fun onCancel(arguments: Any?) {
                              sensorManager?.unregisterListener(listener)
                              eventSink = null
                          }
                      })
              }

              override fun onDestroy() {
                  sensorManager?.unregisterListener(listener)
                  eventSink = null
                  super.onDestroy()
              }
          }
          '''
          p.write_text(source)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run automated tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dnb-plant-ai-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
